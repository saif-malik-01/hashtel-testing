query FilteredProductItemList(
  $channel: String!
  $slugs: [ID!]
  $gte: Float
  $lte: Float
  $sortBy: OrderDirection!
  $after: String
  $search: String
  $first:Int = 10
) {
  products(
    first: $first
    channel: $channel
    filter: { categories: $slugs, price: { gte: $gte, lte: $lte } }
    search: $search
    sortBy: { direction: $sortBy, field: NAME }
    after: $after
  ) {
    edges {
      node {
        ...ProductListItem
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
